# Atualizações automáticas: dependências do npm e as GitHub Actions (que ficam
# fixadas pelo SHA do commit; o Dependabot atualiza o SHA e o comentário da versão).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencias:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Os tipos do Node acompanham a versão do Node usada no projeto (.nvmrc).
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # Versões novas (maiores) do TypeScript esperam o typescript-eslint suportar;
      # essa atualização é feita à mão.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
